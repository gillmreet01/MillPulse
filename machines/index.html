<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Machine Monitoring — Smart Paper Mill Monitoring Dashboard" />
  <title>Machine Monitoring · Smart Paper Mill Monitor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../assets/theme.css" />
  <script src="../assets/theme.js"></script>
</head>
<body>
  <div class="app">
    <!-- ============================== SIDEBAR ============================== -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="overlay" id="overlay"></div>

    <!-- ============================== MAIN ============================== -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="page-title">
            <h1>Machine Monitoring</h1>
            <p>Live status and health across the plant</p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="live-pill">
            <span class="live-dot"></span> Live · <span id="lastUpdated">--:--:--</span>
          </div>
          <div class="avatar topbar-avatar">AS</div>
        </div>
      </header>

      <main class="content">
        <!-- ===== Summary chips ===== -->
        <section class="summary-bar" id="summaryBar"><!-- injected --></section>

        <!-- ===== Toolbar: search + filters ===== -->
        <section class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search by machine name or ID…" aria-label="Search machines" />
          </div>

          <div class="filter-pills" id="filterPills" role="group" aria-label="Filter by status">
            <button class="pill active" data-filter="all">All</button>
            <button class="pill" data-filter="running"><span class="pdot green"></span>Running</button>
            <button class="pill" data-filter="idle"><span class="pdot amber"></span>Idle</button>
            <button class="pill" data-filter="maintenance"><span class="pdot red"></span>Maintenance</button>
            <button class="pill" data-filter="stopped"><span class="pdot slate"></span>Stopped</button>
          </div>
        </section>

        <!-- ===== Machine cards grid ===== -->
        <section class="machine-grid" id="machineGrid" aria-label="Machines"><!-- injected --></section>

        <!-- ===== Empty state ===== -->
        <div class="empty-state" id="emptyState" hidden>
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <p>No machines match your search or filter.</p>
        </div>

        <footer class="page-footer">
          &copy; 2026 Satia Industries Ltd. · Smart Paper Mill Monitoring · Academic Project
        </footer>
      </main>
    </div>
  </div>

  <script src="../assets/auth.js"></script>
  <script src="../data/dummyData.js"></script>
  <script src="../assets/sidebar.js"></script>
  <script src="script.js"></script>
</body>
</html>
